format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$package\
$nodejs\
$bun\
$python\
$rust\
$golang\
$java\
$kubernetes\
$cmd_duration\
$fill\
$time\
$line_break\
$character"""

add_newline = false

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
style             = "bold fg:#8aadf4"
format            = "[$path ]($style)"
truncation_length = 0
truncate_to_repo  = false
substitutions     = { "~" = "~ " }

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "fg:#c6a0f6"
format = "[on ]($style dimmed)[$symbol$branch ]($style bold)"

[git_status]
style      = "fg:#ed8796"
format     = "([$all_status$ahead_behind ]($style))"
conflicted = "⚡"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?"
stashed    = "≡"
modified   = "!"
staged     = "+"
renamed    = "»"
deleted    = "✘"

# ── Package version (shows crate/npm/etc version from manifest) ───────────────
[package]
symbol    = "📦 "
style     = "fg:#f5a97f"
format    = "[is $symbol$version ]($style)"
display_private = false

# ── Node.js — shows version AND detects bun/pnpm/npm/yarn ────────────────────
[nodejs]
symbol            = " "
style             = "fg:#a6da95"
format            = "[via $symbol$version ]($style)"
detect_files      = ["package.json", ".nvmrc", ".node-version"]
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_folders    = ["node_modules"]

# ── Bun runtime ───────────────────────────────────────────────────────────────
[bun]
symbol = " "
style  = "fg:#eed49f"
format = "[via $symbol$version ]($style)"

# ── Package manager hint via custom commands ──────────────────────────────────
# Shows which package manager the project uses
[custom.npm]
command     = "echo npm"
when        = "test -f package-lock.json && ! test -f yarn.lock && ! test -f pnpm-lock.yaml && ! test -f bun.lockb"
symbol      = " "
style       = "fg:#ed8796 dimmed"
format      = "[$symbol$output ]($style)"
description = "Show npm as package manager"

[custom.pnpm]
command     = "pnpm --version 2>/dev/null | head -1"
when        = "test -f pnpm-lock.yaml"
symbol      = " "
style       = "fg:#f5a97f"
format      = "[$symbol pnpm v$output ]($style)"
description = "Show pnpm version"

[custom.yarn]
command     = "yarn --version 2>/dev/null | head -1"
when        = "test -f yarn.lock"
symbol      = "yarn "
style       = "fg:#8bd5ca"
format      = "[$symbol yarn v$output ]($style)"
description = "Show yarn version"

[custom.bun_lock]
command     = "bun --version 2>/dev/null | head -1"
when        = "test -f bun.lockb || test -f bun.lock"
symbol      = "🍞"
style       = "fg:#eed49f"
format      = "[$symbol bun v$output ]($style)"
description = "Show bun version from lockfile"

# ── Other languages ───────────────────────────────────────────────────────────
[python]
symbol             = " "
style              = "fg:#eed49f"
format             = '[via $symbol$version(($virtualenv)) ]($style)'
pyenv_version_name = true

[rust]
symbol = " "
style  = "fg:#ed8796"
format = "[via $symbol$version ]($style)"

[golang]
symbol = " "
style  = "fg:#91d7e3"
format = "[via $symbol$version ]($style)"

[java]
symbol = " "
style  = "fg:#f5a97f"
format = "[via $symbol$version ]($style)"

# ── Kubernetes ────────────────────────────────────────────────────────────────
[kubernetes]
disabled = false
symbol   = "☸ "
style    = "fg:#7dc4e4"
format   = "[on $symbol$context(/$namespace) ]($style)"

# ── Execution time ────────────────────────────────────────────────────────────
[cmd_duration]
min_time          = 2_000
style             = "fg:#6e738d"
format            = "[took $duration ]($style)"
show_milliseconds = false

[fill]
symbol = " "

[time]
disabled    = false
style       = "fg:#6e738d"
format      = "[$time]($style)"
time_format = "%H:%M:%S"

# ── OS ──────────────────────────────────────────────────────────
[os]
disabled = false
style    = "fg:#6e738d"
format   = "[$symbol ]($style)"

[os.symbols]
Macos   = ""
Ubuntu  = " 󰕈 "
Debian  = ""
Arch    = ""
Windows = ""
Unknown = ""

# ── Username ──────────────────────────────────────────────────────────
[username]
style_user  = "fg:#8aadf4"
style_root  = "fg:#ed8796"
format      = "[$user ]($style)"
show_always = true

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[  ](bold fg:#a6da95)"
error_symbol   = "[  ](bold fg:#ed8796)"
vimcmd_symbol  = "[ ](bold fg:#8aadf4)"
